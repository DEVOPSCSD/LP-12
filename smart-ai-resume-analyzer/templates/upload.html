<!DOCTYPE html>
<html>

<head>
    <title>AI Smart Resume Analyzer</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f8;
            text-align: center;
            padding-top: 80px;
        }

        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            color: #333;
        }

        input {
            margin: 20px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Smart Resume Analyzer</h1>

    <p>Upload your resume</p>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <input type="file"
               name="resume"
               accept=".pdf,.docx"
               required>

        <br>

        <button type="submit">
            Analyze Resume
        </button>

    </form>

</div>

</body>
</html>
